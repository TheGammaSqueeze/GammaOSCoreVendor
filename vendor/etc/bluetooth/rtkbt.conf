# RELEASE NAME: 20241015_BT_ANDROID_14.0
# Bluetooth Device Name; NULL or comment means "ro.product.model"
#Name=Realtek Bluetooth

# Device Class
DevClassServiceClass=0x1A
DevClassMajorClass=0x01
DevClassMinorClass=0x1C

#Indicate USB or UART driver bluetooth
BtDeviceNode=?/dev/ttyS6:H5

# BtSnoop log output file
BtSnoopFileName=/data/vendor/bluetooth/btsnoop_hci.cfa

# Preserve existing BtSnoop log before overwriting
BtSnoopSaveLog=true

#bit0 = 1,don't show heartbeat packet in btsnoop
RtkbtLogFilter=1

# configuration for uart card to save HCI log for slave
H5LogOutput=0

# Enable Coex log
BtCoexLogOutput=0

# Enable net btsnoop Dump
RtkBtsnoopNetDump=false


# Enable auto restart bt
RtkBtAutoRestart=true

# Enable caputure fw log Via HCI
RtkBtCaptureFwLog=false

# WoBLE V2.1
# The number in the RtkAPCFWakeUpSets shall follow the rules bellow:
# 1. can only be seperated in one non-number character!
# 2. begins from 1 and cannot currently be greater than 10!
# 3. cannot repeat!
# For example RtkAPCFWakeUpSets=1,3,4
RtkAPCFWakeUpSets=

